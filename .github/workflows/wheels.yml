name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: macos-aarch64
            runner: macos-14
          - platform: windows-x86_64
            runner: windows-2022
          # The NDK cross-builds on x86_64; Android binaries run in Termux smoke.
          - platform: android-aarch64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # build_wheels.py packs the shaded javalint.jar via `mvn package`; maven
      # is pre-installed on all runner images, setup-java supplies the JDK.
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Build wheels for ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_wheels.py \
            --outdir dist \
            --version 0.0.0 \
            --platform ${{ matrix.platform }}
          ls -lh dist/

      - name: Enforce PyPI 100 MiB per-file limit
        shell: bash
        run: |
          set -euo pipefail
          limit=$((100 * 1024 * 1024))
          fail=0
          for w in dist/*.whl; do
            size=$(wc -c <"$w")
            printf '%s\t%s bytes\n' "$w" "$size"
            if [ "$size" -gt "$limit" ]; then
              echo "wheel $w exceeds PyPI 100 MiB per-file limit: $size bytes" >&2
              fail=1
            fi
          done
          exit "$fail"

      - name: Install thin wheel; stage both payloads from the built payload wheels
        if: matrix.platform != 'android-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 .wheels-venv
          fat=$(ls dist/tackbox_engines-*.whl | head -n1)
          opengrep=$(ls dist/tackbox_opengrep-*.whl | head -n1)
          thin=$(ls dist/tackbox-0.0.0-*.whl | head -n1)
          echo "fat=$fat"
          echo "opengrep=$opengrep"
          echo "thin=$thin"
          # Thin installs alone: the payloads are store fetches, not pip dependencies.
          uv pip install --python .wheels-venv "$thin"
          # The store can't fetch an unpublished version; supply each payload by
          # unpacking its just-built wheel and overriding its store directory.
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('engines-payload')" "$fat"
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('opengrep-payload')" "$opengrep"
          chmod -R u+x engines-payload/tackbox_engines/bin opengrep-payload/tackbox_opengrep/bin || true
          echo "TACKBOX_ENGINES_DIR=$PWD/engines-payload/tackbox_engines" >> "$GITHUB_ENV"
          echo "TACKBOX_OPENGREP_DIR=$PWD/opengrep-payload/tackbox_opengrep" >> "$GITHUB_ENV"

      - name: Materialize fixture repo
        if: matrix.platform != 'android-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fixture-repo
          python scripts/materialize_fixture.py fixture-repo

      - name: tackbox doctor (expect exit 0)
        if: matrix.platform != 'android-aarch64'
        shell: bash
        working-directory: fixture-repo
        run: |
          set -euo pipefail
          if [ -f ../.wheels-venv/bin/tackbox ]; then
            tackbox=../.wheels-venv/bin/tackbox
          elif [ -f ../.wheels-venv/Scripts/tackbox.exe ]; then
            tackbox=../.wheels-venv/Scripts/tackbox.exe
          else
            echo "no tackbox entrypoint found under .wheels-venv/" >&2
            exit 1
          fi
          "$tackbox" doctor

      - name: tackbox lint (expect exit 1 on planted violations)
        if: matrix.platform != 'android-aarch64'
        shell: bash
        working-directory: fixture-repo
        run: |
          set -eo pipefail
          if [ -f ../.wheels-venv/bin/tackbox ]; then
            tackbox=../.wheels-venv/bin/tackbox
          elif [ -f ../.wheels-venv/Scripts/tackbox.exe ]; then
            tackbox=../.wheels-venv/Scripts/tackbox.exe
          else
            echo "no tackbox entrypoint found under .wheels-venv/" >&2
            exit 1
          fi
          set +e
          "$tackbox" lint . --no-cache
          rc=$?
          set -e
          echo "lint exit=$rc"
          if [ "$rc" != "1" ]; then
            echo "expected exit 1 (planted ERC001+no-swallow-catch+MD-CHARS), got $rc" >&2
            exit 1
          fi

      - name: Upload wheels artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # Termux supplies Android's libc and Python wheel tags on the arm64 runner.
  smoke-android:
    name: smoke android-aarch64 (Termux)
    needs: wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Android wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-android-aarch64
          path: dist

      - name: Termux smoke (thin alone + staged payloads; hook-protocol, doctor, lint)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --security-opt seccomp=unconfined -v "$PWD:/mnt/repo:ro" \
            termux/termux-docker:aarch64@sha256:18e2c6a633642d0806afd7abaeb0e74b2b957c92f6f30021260e5ba997579f48 \
            bash -c 'bash /mnt/repo/scripts/termux_smoke.sh provision && bash /mnt/repo/scripts/termux_smoke.sh wheels /mnt/repo/dist'
